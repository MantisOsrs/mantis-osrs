<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — Mantis OSRS</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#111b14;
      color:#eef4eb;
      font-family:Arial,Helvetica,sans-serif;
    }
    main{
      width:min(360px,calc(100% - 28px));
      padding:28px;
      border:1px solid #394b3d;
      background:#18231b;
    }
    h1{margin:0 0 12px;font-size:1.4rem}
    p{margin:0 0 22px;color:#a7b4a5;line-height:1.5}
    a{color:#d3f3bd;text-decoration:none;font-size:.8rem}
  
    body{
      background:
        radial-gradient(circle at 16% 22%, rgba(111,190,89,.13), transparent 22rem),
        radial-gradient(circle at 84% 76%, rgba(173,224,148,.08), transparent 20rem),
        linear-gradient(180deg,#050706 0%,#090c0a 42%,#0d120f 100%) !important;
    }
    main{
      box-shadow:
        0 18px 42px rgba(0,0,0,.18),
        0 0 30px rgba(111,190,89,.05);
    }

  
    body::before,
    body::after {
      inset:auto;
      background:none;
    }

    body {
      overflow-x:hidden;
      background:linear-gradient(180deg,#050706 0%,#090c0a 42%,#0d120f 100%) !important;
    }


    /* Vertical ambient glow streaks */
    body::before,
    body::after {
      content: "";
      position: fixed;
      top: -22vh;
      bottom: -22vh;
      width: 52px;
      height: auto;
      border-radius: 0;
      pointer-events: none;
      z-index: 0;
      filter: blur(8px);
      opacity: .82;
      background:
        linear-gradient(
          180deg,
          transparent 0%,
          rgba(165, 255, 164, .00) 10%,
          rgba(165, 255, 164, .08) 24%,
          rgba(120, 255, 143, .20) 40%,
          rgba(236, 255, 244, .72) 50%,
          rgba(120, 255, 143, .20) 60%,
          rgba(165, 255, 164, .08) 76%,
          rgba(165, 255, 164, .00) 90%,
          transparent 100%
        );
      animation: streakDrift 8s ease-in-out infinite;
    }

    body::before {
      left: 8%;
    }

    body::after {
      right: 8%;
      width: 52px;
      opacity: .82;
      animation-delay: -3.2s;
      animation-duration: 10s;
    }

    @keyframes streakDrift {
      0%, 100% { transform: translateY(-7%); }
      50% { transform: translateY(7%); }
    }

    @media (max-width: 700px) {
      body::before {
        left: -28px;
        width: 38px;
      }

      body::after {
        right: -24px;
        width: 38px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before,
      body::after,
      .mantis-bob,
      .mantis-eye,
      .party-hat,
      .hammer-arm {
        animation: none !important;
      }
    }

  
    /* glossy black sheen */
    body {
      position: relative;
    }

    body > * {
      position: relative;
      z-index: 1;
    }

    body::selection {
      background: rgba(170,255,164,.25);
    }


    /* Keep the original v50 text placement while reserving space for the animation. */
    main{
      box-sizing:border-box;
      width:min(590px,calc(100% - 28px));
      padding:28px 200px 28px 28px;
      position:relative;
    }

    .admin-mantis{
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 138px;
      width:138px;
      height:122px;
      margin:0;
    }
    .admin-mantis svg{
      display:block;
      width:132px;
      height:132px;
      overflow:visible;
      filter:drop-shadow(0 7px 13px rgba(0,0,0,.3));
    }
    .mantis-bob{
      animation:mantisBob 3.1s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:center;
    }
    .mantis-eye{
      animation:mantisBlink 5.4s infinite;
      transform-box:fill-box;
      transform-origin:center;
    }
    .party-hat{
      animation:hatBounce 3.1s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:center bottom;
    }
    .hammer-arm{
      animation:hammerSwing 2.15s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:18% 82%;
    }
    @keyframes mantisBob{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-4px)}
    }
    @keyframes mantisBlink{
      0%,45%,51%,100%{transform:scaleY(1)}
      47%,49%{transform:scaleY(.12)}
    }
    @keyframes hatBounce{
      0%,100%{transform:rotate(-1.5deg) translateY(0)}
      50%{transform:rotate(1.5deg) translateY(-1.5px)}
    }
    @keyframes hammerSwing{
      0%,100%{transform:rotate(-9deg)}
      45%{transform:rotate(15deg)}
      62%{transform:rotate(8deg)}
    }

    /* The animation sits independently at the right and is centered vertically. */
    .admin-mantis{
      position:absolute;
      right:28px;
      top:50%;
      transform:translateY(-50%);
      margin:0;
    }

    @media (max-width: 560px) {
      main{
        padding-right:148px;
      }
      .admin-mantis{
        right:15px;
        width:112px;
        height:108px;
      }
      .admin-mantis svg{
        width:112px;
        height:112px;
      }
    }

  </style>
</head>
<body>
  <main>
    <h1>Admin Login</h1>
    <p>Admin controls will be added when the game board is live.</p>
    <a href="index.html">Back to home</a>

      <div class="admin-mantis" role="img" aria-label="Animated mantis wearing a blue Old School RuneScape-style partyhat and holding an Old School RuneScape-style hammer">
        <svg viewBox="0 0 220 220" aria-hidden="true" focusable="false">

              <stop offset="1" stop-color="#2f6f38"/>
            </linearGradient>
            <linearGradient id="adminMantisDark" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6eb958"/>
              <stop offset="1" stop-color="#17361f"/>
            </linearGradient>
            <linearGradient id="partyHatBlue" x1="0" y1="0" x2="1" y2="1">

              <stop offset=".42" stop-color="#173fd4"/>
              <stop offset="1" stop-color="#07146d"/>
            </linearGradient>
            <linearGradient id="partyHatBlueDark" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#244adf"/>
              <stop offset="1" stop-color="#060c4b"/>
            </linearGradient>

            </linearGradient>
            <linearGradient id="hammerWood" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8a5b1f"/>

              <stop offset="1" stop-color="#321b06"/>
            </linearGradient>
          </defs>

          <g class="mantis-bob" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M96 45 C80 25 62 17 42 21 C60 25 72 31 80 41"
                  stroke="#75bf5d" stroke-width="4"/>
            <path d="M124 45 C140 25 158 17 178 21 C160 25 148 31 140 41"
                  stroke="#75bf5d" stroke-width="4"/>

            <path d="M94 89 C73 96 59 111 50 130 C43 145 30 152 17 147
                     M50 130 L32 120 L21 103 M33 120 L20 136"
                  stroke="url(#adminMantisBody)" stroke-width="8"/>

            <g class="hammer-arm">
              <path d="M126 89 C147 96 162 110 172 127 C180 140 190 145 200 139"
                    stroke="url(#adminMantisBody)" stroke-width="8"/>
              <g transform="rotate(42 184 108)">
                <rect x="176.5" y="105" width="9" height="43" rx="4.5"
                      fill="url(#hammerWood)" stroke="#2c1806" stroke-width="2"/>
                <path d="M179 108 L183 108 L183 145 L179 145 Z"
                      fill="#a36e2a" opacity=".42"/>
                <path d="M158 96 L196 96 L204 104 L196 114 L158 114 L151 106 Z"
                      fill="url(#hammerMetal)" stroke="#353338" stroke-width="3"/>
                <path d="M159 99 L191 99" stroke="#eeeae7" stroke-width="2" opacity=".55"/>
                <path d="M196 98 L201 104 L195 111" fill="none" stroke="#68646a" stroke-width="2"/>
              </g>
            </g>

            <path d="M108 63 C96 84 92 109 95 135 C97 156 101 176 110 199
                     C119 176 123 156 125 135 C128 109 124 84 112 63 Z"
                  fill="url(#adminMantisBody)" stroke="#8bd373" stroke-width="4"/>

            <g>
              <path d="M110 65 C95 60 87 48 91 34 C96 19 124 19 129 34
                       C133 48 125 60 110 65 Z"
                    fill="url(#adminMantisDark)" stroke="#91d879" stroke-width="4"/>
              <ellipse class="mantis-eye" cx="98" cy="40" rx="8" ry="6"
                       fill="#dfffaa" stroke="#c8f598" stroke-width="1.5"/>
              <ellipse class="mantis-eye" cx="122" cy="40" rx="8" ry="6"
                       fill="#dfffaa" stroke="#c8f598" stroke-width="1.5"/>
              <path d="M103 54 Q110 59 117 54" stroke="#16361e" stroke-width="3"/>
            </g>

            <g class="party-hat">
              <path d="M88 21 L94 -6 L105 10 L113 -13 L121 9 L133 -7 L138 22
                       Q113 30 88 21 Z"
                    fill="url(#partyHatBlue)" stroke="#758cff" stroke-width="3"/>
              <path d="M89 21 Q113 31 137 22 L136 28 Q113 36 90 27 Z"
                    fill="url(#partyHatBlueDark)" stroke="#0a217f" stroke-width="2.5"/>
              <path d="M91 22 Q113 29 136 22" stroke="#8aa0ff" stroke-width="2.5" opacity=".8"/>
            </g>

            <path d="M98 133 C83 144 73 163 64 191"
                  stroke="#448f42" stroke-width="7"/>
            <path d="M122 133 C137 144 147 163 156 191"
                  stroke="#448f42" stroke-width="7"/>
          </g>
        </svg>
      </div>
  </main>
</body>
</html>
